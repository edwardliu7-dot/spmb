openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: applications
    description: SPMB registration operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Database unavailable or schema is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /submit:
    post:
      operationId: submitApplication
      tags: [applications]
      summary: Submit a new SPMB application
      description: Stores student registration data and the uploaded supporting documents.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/StudentApplicationInput"
      responses:
        "201":
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResult"
        "400":
          description: Invalid form data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "413":
          description: Request or uploaded file is too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many submissions from the same network
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /payment/verify:
    post:
      operationId: verifyPayment
      tags: [applications]
      summary: Screen a payment proof before registration
      description: Uses Groq Vision for preliminary recognition of a payment proof image. This does not confirm that funds were received.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PaymentVerificationInput"
      responses:
        "200":
          description: Payment proof screening result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentVerificationResult"
        "400":
          description: Invalid or missing payment proof
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many verification attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: AI verification service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "503":
          description: AI verification is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      operationId: committeeMe
      tags: [applications]
      summary: Get the signed-in committee user
      security:
        - committeeSession: []
      responses:
        "200":
          description: Current committee user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/CommitteeUser"
                required: [user]
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: committeeLogout
      tags: [applications]
      summary: Sign out of the committee panel
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                required: [success]
  /applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List SPMB applications
      description: Returns application summaries for the committee panel.
      security:
        - committeeSession: []
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: Search by applicant name or application number.
        - name: jenjang
          in: query
          required: false
          schema: { type: string, enum: [Semua, Playgroup, Daycare, TK-A, TK-B, SD, SMP] }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [Semua, Baru, Diverifikasi, "Perlu Perbaikan", Diterima, Ditolak] }
      responses:
        "200":
          description: Application summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationListResponse"
  /applications/{id}:
    get:
      operationId: getApplication
      tags: [applications]
      summary: Get an application detail
      security:
        - committeeSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Full application detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDetail"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /applications/{id}/status:
    patch:
      operationId: updateApplicationStatus
      tags: [applications]
      summary: Update application status
      security:
        - committeeSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationStatusUpdate"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationStatusResponse"
        "400":
          description: Invalid status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /applications/{id}/files/{field}:
    get:
      operationId: getApplicationFile
      tags: [applications]
      summary: Open an uploaded application document
      security:
        - committeeSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
        - name: field
          in: path
          required: true
          schema:
            type: string
            enum: [foto_3x4, akte_lahir, kartu_keluarga, ktp_orangtua, bukti_bayar]
      responses:
        "200":
          description: Uploaded document
          content:
            application/octet-stream: {}
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    committeeSession:
      type: apiKey
      in: cookie
      name: spmb_committee_session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        database:
          type: string
      required:
        - status
        - database
    StudentApplicationInput:
      type: object
      required:
        - jenjang
        - nama_calon
        - nama_panggilan
        - jenis_kelamin
        - tempat_lahir
        - tanggal_lahir
        - nik_anak
        - alamat_domisili
        - anak_ke
        - jumlah_saudara
        - status_anak
        - agama
        - warga_negara
        - tinggi_badan
        - berat_badan
        - transportasi
        - jarak_sekolah
        - nomor_kk
        - nik_ayah
        - nik_ibu
        - nomor_hp_orangtua
        - email
        - nama_ayah
        - ttl_ayah
        - pendidikan_ayah
        - pekerjaan_ayah
        - penghasilan_ayah
        - instansi_jabatan_ayah
        - nama_ibu
        - ttl_ibu
        - pendidikan_ibu
        - pekerjaan_ibu
        - penghasilan_ibu
        - instansi_jabatan_ibu
        - foto_3x4
        - akte_lahir
        - kartu_keluarga
        - ktp_orangtua
        - bukti_bayar
      properties:
        jenjang: { type: string, enum: [Playgroup, Daycare, TK-A, TK-B, SD, SMP] }
        nama_calon: { type: string, minLength: 2, maxLength: 100 }
        nama_panggilan: { type: string, minLength: 1, maxLength: 100 }
        jenis_kelamin: { type: string, enum: [Laki-laki, Perempuan] }
        tempat_lahir: { type: string, minLength: 1, maxLength: 100 }
        tanggal_lahir:
          type: string
          format: date
          description: "Usia dihitung pada 1 Juli 2027. Minimum: Playgroup 3 tahun, TK-A 4 tahun, TK-B 5 tahun, SD 6 tahun. Daycare dan SMP tidak memiliki batas usia minimum."
        nisn: { type: string, pattern: "^[0-9]{10}$", maxLength: 10, nullable: true }
        nik_anak: { type: string, pattern: "^[0-9]{16}$", minLength: 16, maxLength: 16 }
        alamat_domisili: { type: string, minLength: 1, maxLength: 1000 }
        anak_ke: { type: string, pattern: "^[0-9]+$", description: "Integer from 1 to 20" }
        jumlah_saudara: { type: string, pattern: "^[0-9]+$", description: "Integer from 0 to 50" }
        status_anak: { type: string, minLength: 1, maxLength: 50 }
        agama: { type: string, minLength: 1, maxLength: 50 }
        warga_negara: { type: string, minLength: 1, maxLength: 50 }
        tinggi_badan: { type: string, pattern: "^[0-9]+([.][0-9]+)?$", description: "Height in centimeters" }
        berat_badan: { type: string, pattern: "^[0-9]+([.][0-9]+)?$", description: "Weight in kilograms" }
        riwayat_penyakit: { type: string, maxLength: 1000, nullable: true }
        transportasi: { type: string, minLength: 1, maxLength: 50 }
        jarak_sekolah: { type: string, minLength: 1, maxLength: 100 }
        nama_sekolah_asal: { type: string, minLength: 1, maxLength: 255, nullable: true, description: "Required for SD and SMP; not required for Playgroup, Daycare, TK-A, or TK-B" }
        tahun_lulus: { type: string, pattern: "^[0-9]{4}$", nullable: true, description: "Graduation year, 1900 or later; required for SD and SMP" }
        alamat_sekolah_asal: { type: string, minLength: 1, maxLength: 1000, nullable: true, description: "Required for SD and SMP; not required for Playgroup, Daycare, TK-A, or TK-B" }
        nomor_kk: { type: string, pattern: "^[0-9]{16}$", minLength: 16, maxLength: 16 }
        nik_ayah: { type: string, pattern: "^[0-9]{16}$", minLength: 16, maxLength: 16 }
        nik_ibu: { type: string, pattern: "^[0-9]{16}$", minLength: 16, maxLength: 16, nullable: true }
        nomor_hp_orangtua: { type: string, minLength: 10, maxLength: 16 }
        email: { type: string, pattern: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$", maxLength: 254 }
        nama_ayah: { type: string, minLength: 1, maxLength: 100 }
        ttl_ayah: { type: string, minLength: 1, maxLength: 150 }
        pendidikan_ayah: { type: string, minLength: 1, maxLength: 100 }
        pekerjaan_ayah: { type: string, minLength: 1, maxLength: 100 }
        penghasilan_ayah: { type: string, minLength: 1, maxLength: 100 }
        instansi_jabatan_ayah: { type: string, minLength: 1, maxLength: 150 }
        nama_ibu: { type: string, minLength: 1, maxLength: 100 }
        ttl_ibu: { type: string, minLength: 1, maxLength: 150 }
        pendidikan_ibu: { type: string, minLength: 1, maxLength: 100 }
        pekerjaan_ibu: { type: string, minLength: 1, maxLength: 100 }
        penghasilan_ibu: { type: string, minLength: 1, maxLength: 100 }
        instansi_jabatan_ibu: { type: string, minLength: 1, maxLength: 150 }
        nama_wali: { type: string, maxLength: 100, nullable: true }
        hubungan_wali: { type: string, maxLength: 100, nullable: true }
        foto_3x4: { type: string, description: "Uploaded JPG or PNG file, maximum 5 MB" }
        akte_lahir: { type: string, description: "Uploaded PDF, JPG, or PNG file, maximum 5 MB" }
        kartu_keluarga: { type: string, description: "Uploaded PDF, JPG, or PNG file, maximum 5 MB" }
        ktp_orangtua: { type: string, description: "Uploaded PDF, JPG, or PNG file, maximum 5 MB" }
        bukti_bayar: { type: string, description: "Uploaded PDF, JPG, or PNG file, maximum 5 MB" }
    PaymentVerificationInput:
      type: object
      required: [bukti_bayar]
      properties:
        bukti_bayar:
          type: string
          description: Payment proof image for AI screening, JPG or PNG, maximum 5 MB
    PaymentVerificationResult:
      type: object
      properties:
        success: { type: boolean }
        status: { type: string, enum: [verified, needs_review, rejected] }
        message: { type: string }
        confidence: { type: number, minimum: 0, maximum: 1 }
        reason: { type: string }
        details:
          type: object
          properties:
            amount: { type: string, nullable: true }
            transactionReference: { type: string, nullable: true }
            recipient: { type: string, nullable: true }
            transactionDate: { type: string, nullable: true }
          required: [amount, transactionReference, recipient, transactionDate]
      required: [success, status, message, confidence, reason, details]
    SubmissionResult:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        id: { type: number }
        receiptUrl: { type: string }
      required: [success, message, id, receiptUrl]
    ApplicationListItem:
      type: object
      properties:
        id: { type: number }
        nama_calon: { type: string }
        jenjang: { type: string }
        nama_sekolah_asal: { type: string, nullable: true }
        email: { type: string }
        status: { type: string }
        created_at: { type: string }
      required: [id, nama_calon, jenjang, nama_sekolah_asal, email, status, created_at]
    ApplicationListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationListItem"
        total: { type: number }
      required: [items, total]
    ApplicationFile:
      type: object
      properties:
        field: { type: string }
        label: { type: string }
        url: { type: string }
        available: { type: boolean }
      required: [field, label, url, available]
    ApplicationDetail:
      allOf:
        - $ref: "#/components/schemas/ApplicationListItem"
        - $ref: "#/components/schemas/StudentApplicationInput"
        - type: object
          properties:
            files:
              type: array
              items:
                $ref: "#/components/schemas/ApplicationFile"
          required: [files]
    ApplicationStatusUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [Baru, Diverifikasi, "Perlu Perbaikan", Diterima, Ditolak]
      required: [status]
    ApplicationStatusResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        id: { type: number }
        status: { type: string }
      required: [success, message, id, status]
    CommitteeUser:
      type: object
      properties:
        username: { type: string }
        label: { type: string }
        allowedJenjang:
          type: array
          items: { type: string }
      required: [username, label, allowedJenjang]
    CommitteeAuthResponse:
      type: object
      properties:
        success: { type: boolean }
        user:
          $ref: "#/components/schemas/CommitteeUser"
      required: [success, user]
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
        fields:
          type: array
          items: { type: string }
      required: [error]

