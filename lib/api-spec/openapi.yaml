openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: applications
    description: SPMB registration operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /submit:
    post:
      operationId: submitApplication
      tags: [applications]
      summary: Submit a new SPMB application
      description: Stores student registration data and the uploaded supporting documents.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/StudentApplicationInput"
      responses:
        "201":
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResult"
        "400":
          description: Invalid form data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      operationId: committeeMe
      tags: [applications]
      summary: Get the signed-in committee user
      security:
        - committeeSession: []
      responses:
        "200":
          description: Current committee user
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/CommitteeUser"
                required: [user]
        "401":
          description: Not signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: committeeLogout
      tags: [applications]
      summary: Sign out of the committee panel
      responses:
        "200":
          description: Signed out
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                required: [success]
  /applications:
    get:
      operationId: listApplications
      tags: [applications]
      summary: List SPMB applications
      description: Returns application summaries for the committee panel.
      security:
        - committeeSession: []
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: Search by applicant name or application number.
        - name: jenjang
          in: query
          required: false
          schema: { type: string, enum: [Semua, Playgroup, Daycare, TK-A, TK-B, SD, SMP] }
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [Semua, Baru, Diverifikasi, "Perlu Perbaikan", Diterima, Ditolak] }
      responses:
        "200":
          description: Application summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationListResponse"
  /applications/{id}:
    get:
      operationId: getApplication
      tags: [applications]
      summary: Get an application detail
      security:
        - committeeSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Full application detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationDetail"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /applications/{id}/status:
    patch:
      operationId: updateApplicationStatus
      tags: [applications]
      summary: Update application status
      security:
        - committeeSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationStatusUpdate"
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationStatusResponse"
        "400":
          description: Invalid status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /applications/{id}/files/{field}:
    get:
      operationId: getApplicationFile
      tags: [applications]
      summary: Open an uploaded application document
      security:
        - committeeSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: number }
        - name: field
          in: path
          required: true
          schema:
            type: string
            enum: [foto_3x4, akte_lahir, kartu_keluarga, ktp_orangtua, bukti_bayar]
      responses:
        "200":
          description: Uploaded document
          content:
            application/octet-stream: {}
        "404":
          description: Document not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    committeeSession:
      type: apiKey
      in: cookie
      name: spmb_committee_session
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    StudentApplicationInput:
      type: object
      required:
        - jenjang
        - nama_calon
        - nama_panggilan
        - jenis_kelamin
        - tempat_lahir
        - tanggal_lahir
        - nisn
        - nik_anak
        - alamat_domisili
        - anak_ke
        - jumlah_saudara
        - status_anak
        - agama
        - warga_negara
        - tinggi_badan
        - berat_badan
        - riwayat_penyakit
        - transportasi
        - jarak_sekolah
        - nama_sekolah_asal
        - tahun_lulus
        - alamat_sekolah_asal
        - nomor_kk
        - nik_orangtua
        - nomor_hp_orangtua
        - email
        - nama_ayah
        - ttl_ayah
        - pendidikan_ayah
        - pekerjaan_ayah
        - penghasilan_ayah
        - instansi_jabatan_ayah
        - nama_ibu
        - ttl_ibu
        - pendidikan_ibu
        - pekerjaan_ibu
        - penghasilan_ibu
        - instansi_jabatan_ibu
        - nama_wali
        - hubungan_wali
      properties:
        jenjang: { type: string, enum: [Playgroup, Daycare, TK-A, TK-B, SD, SMP] }
        nama_calon: { type: string, minLength: 2 }
        nama_panggilan: { type: string, minLength: 1 }
        jenis_kelamin: { type: string, enum: [Laki-laki, Perempuan] }
        tempat_lahir: { type: string }
        tanggal_lahir: { type: string, format: date }
        nisn: { type: string }
        nik_anak: { type: string }
        alamat_domisili: { type: string }
        anak_ke: { type: string, description: "Integer greater than or equal to 1" }
        jumlah_saudara: { type: string, description: "Integer greater than or equal to 0" }
        status_anak: { type: string }
        agama: { type: string }
        warga_negara: { type: string }
        tinggi_badan: { type: string, description: "Height in centimeters" }
        berat_badan: { type: string, description: "Weight in kilograms" }
        riwayat_penyakit: { type: string }
        transportasi: { type: string }
        jarak_sekolah: { type: string }
        nama_sekolah_asal: { type: string }
        tahun_lulus: { type: string, description: "Graduation year, 1900 or later" }
        alamat_sekolah_asal: { type: string }
        nomor_kk: { type: string }
        nik_orangtua: { type: string }
        nomor_hp_orangtua: { type: string }
        email: { type: string }
        nama_ayah: { type: string }
        ttl_ayah: { type: string }
        pendidikan_ayah: { type: string }
        pekerjaan_ayah: { type: string }
        penghasilan_ayah: { type: string }
        instansi_jabatan_ayah: { type: string }
        nama_ibu: { type: string }
        ttl_ibu: { type: string }
        pendidikan_ibu: { type: string }
        pekerjaan_ibu: { type: string }
        penghasilan_ibu: { type: string }
        instansi_jabatan_ibu: { type: string }
        nama_wali: { type: string }
        hubungan_wali: { type: string }
        foto_3x4: { type: string, description: "Uploaded file" }
        akte_lahir: { type: string, description: "Uploaded file" }
        kartu_keluarga: { type: string, description: "Uploaded file" }
        ktp_orangtua: { type: string, description: "Uploaded file" }
        bukti_bayar: { type: string, description: "Uploaded file" }
    SubmissionResult:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        id: { type: number }
      required: [success, message, id]
    ApplicationListItem:
      type: object
      properties:
        id: { type: number }
        nama_calon: { type: string }
        jenjang: { type: string }
        nama_sekolah_asal: { type: string }
        email: { type: string }
        status: { type: string }
        created_at: { type: string }
      required: [id, nama_calon, jenjang, nama_sekolah_asal, email, status, created_at]
    ApplicationListResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ApplicationListItem"
        total: { type: number }
      required: [items, total]
    ApplicationFile:
      type: object
      properties:
        field: { type: string }
        label: { type: string }
        url: { type: string }
        available: { type: boolean }
      required: [field, label, url, available]
    ApplicationDetail:
      allOf:
        - $ref: "#/components/schemas/ApplicationListItem"
        - $ref: "#/components/schemas/StudentApplicationInput"
        - type: object
          properties:
            files:
              type: array
              items:
                $ref: "#/components/schemas/ApplicationFile"
          required: [files]
    ApplicationStatusUpdate:
      type: object
      properties:
        status:
          type: string
          enum: [Baru, Diverifikasi, "Perlu Perbaikan", Diterima, Ditolak]
      required: [status]
    ApplicationStatusResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        id: { type: number }
        status: { type: string }
      required: [success, message, id, status]
    CommitteeUser:
      type: object
      properties:
        username: { type: string }
        label: { type: string }
        allowedJenjang:
          type: array
          items: { type: string }
      required: [username, label, allowedJenjang]
    CommitteeAuthResponse:
      type: object
      properties:
        success: { type: boolean }
        user:
          $ref: "#/components/schemas/CommitteeUser"
      required: [success, user]
    ErrorResponse:
      type: object
      properties:
        error: { type: string }
      required: [error]

